<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Coffee Shop</title>
    <link rel="shortcut icon" href="c:\Users\ANDALOS\Desktop\4419157.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style3create.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
/* رسالة التأكيد المعدلة للجوال */
.success-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.95);
    color: white;
    padding: 25px;
    border-radius: 12px;
    z-index: 1000;
    text-align: center;
    display: none;
    animation: fadeIn 0.4s ease-out;
    width: 90%;
    max-width: 320px;
    box-sizing: border-box;
    border: 2px solid rgba(159, 120, 58, 0.3);
    box-shadow: 0 5px 25px rgba(0,0,0,0.4);
}

@keyframes fadeIn {
    from { 
        opacity: 0;
        transform: translate(-50%, -40%) scale(0.95);
    }
    to { 
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

.success-message i {
    color: rgb(159, 120, 58);
    font-size: 42px;
    margin-bottom: 15px;
    display: block;
}

.success-btn {
    background: rgb(159, 120, 58);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 6px;
    margin-top: 20px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
    max-width: 200px;
    transition: all 0.3s;
}

.success-btn:hover {
    background: rgb(139, 100, 38);
    transform: translateY(-2px);
}

/* تعديلات خاصة للشاشات الصغيرة */
@media (max-width: 480px) {
    .success-message {
        padding: 20px;
        width: 85%;
    }
    
    .success-message h2 {
        font-size: 20px;
        margin: 10px 0;
    }
    
    .success-message p {
        font-size: 14px;
    }
    
    .success-btn {
        padding: 10px 20px;
        font-size: 15px;
    }
}
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="background-video">
        <source src="./aTC_RNYtEb0.mp4" type="video/mp4">
    </video>

    <div class="wrapper">
        <form id="bookingForm" style="color: rgb(240, 240, 240);">
            <h1>MY Coffee Shop <i class="fa-solid fa-mug-hot"></i></h1>

            <div class="input-c">
                <input type="text" id="name" placeholder="Enter Your Name" name="name" required>  
                <i class='bx bxs-user-circle'></i>
            </div>

            <div class="input-c">
                <input type="email" id="email" placeholder="Enter Your Email" name="email" required>
                <i class='bx bx-edit'></i>
            </div>
            
            <div class="input-c">
                <input type="text" id="phone" placeholder="Enter Your Phone" name="phone" required>
                <i class='bx bx-phone'></i>
            </div>

            <button type="submit" class="btn">Create Reservation</button>
        </form>
    </div>

    <!-- رسالة التأكيد -->
    <div id="successMessage" class="success-message">
        <i class="fas fa-check-circle"></i>
        <h2>Reservation Confirmed</h2>
        <p id="confirmationText">Thank you for your reservation</p>
        <button class="success-btn" onclick="hideSuccess()">OK</button>
    </div>

    <script>
        // عند إرسال النموذج
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إرسال النموذج بالطريقة التقليدية
            
            // جمع البيانات من النموذج
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            
            // هنا يمكنك إضافة كود لحفظ البيانات إذا كنت تريد
            
            // عرض تفاصيل الحجز في الرسالة
            document.getElementById('confirmationText').innerHTML = `<br>
                Thank you, <strong>${name}</strong><br>

            `;
            
            // إظهار رسالة التأكيد
            document.getElementById('successMessage').style.display = 'block';
            
            // مسح النموذج
            this.reset();
        });

        // وظيفة لإخفاء رسالة التأكيد
        function hideSuccess() {
            document.getElementById('successMessage').style.display = 'none';
        }
    </script>
</body>
</html>
